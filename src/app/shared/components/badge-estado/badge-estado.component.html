<span class="badge rounded-pill px-3 py-1"
      [ngClass]="{
        'badge-aprobado':  estado === 'Aprobado',
        'badge-reprobado': estado === 'Reprobado',
        'badge-pendiente': estado === 'Pendiente'
      }">
  {{ estado }}
</span>
